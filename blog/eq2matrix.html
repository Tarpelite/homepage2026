<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从方程到矩阵：求解的第一步</title>
<style>
:root {
  --bg: #0A1A33; --stage: #0F2647; --panel: #132E52;
  --ink: #EAF2FC; --muted: #93AACB; --dim: #4E6589;
  --blue: #64B1F2; --yellow: #F2C94C; --green: #5FD3A2;
  --red: #EE6D5C; --purple: #B48CF2;
  --serif: Georgia, "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", serif;
  --mono: Consolas, "SFMono-Regular", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--serif);
       min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.wrap { width: min(1020px, 96vw); padding: 28px 0 40px; }
header { text-align: center; margin-bottom: 18px; }
.kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 4px;
          color: var(--muted); margin-bottom: 10px; }
h1 { font-size: 30px; font-weight: normal; letter-spacing: 4px; }
.sub { color: var(--muted); font-size: 14.5px; margin-top: 8px; letter-spacing: 1px; }
.stage-box { background: var(--stage); border-radius: 14px; overflow: hidden;
             box-shadow: 0 18px 60px rgba(3, 10, 25, 0.6); position: relative; }
svg { display: block; width: 100%; height: auto; }
.caption { min-height: 86px; padding: 18px 26px 6px; text-align: center;
           font-size: 16.5px; line-height: 1.85; color: var(--ink);
           transition: opacity .45s; }
.caption em { font-style: normal; color: var(--yellow); }
.caption .b { color: var(--blue); } .caption .g { color: var(--green); }
.caption .r { color: var(--red); } .caption .p { color: var(--purple); }
.controls { display: flex; align-items: center; justify-content: center;
            gap: 18px; margin-top: 14px; flex-wrap: wrap; }
button { background: none; border: 1px solid rgba(147,170,203,0.5); color: var(--muted);
         width: 40px; height: 40px; border-radius: 50%; font-size: 15px;
         cursor: pointer; transition: all .2s; font-family: var(--mono); }
button:hover { border-color: var(--ink); color: var(--ink); }
.dots { display: flex; gap: 8px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(147,170,203,0.35);
          cursor: pointer; transition: all .25s; }
.dots i.on { background: var(--yellow); transform: scale(1.3); }
.idx { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 52px;
       text-align: center; }

/* ---------- scene machinery ---------- */
.scene { opacity: 0; pointer-events: none; transition: opacity .55s ease; }
.scene.on { opacity: 1; pointer-events: auto; }
.scene .in { opacity: 0; }
.scene.on .in { animation: fadeUp .7s ease forwards; animation-delay: var(--d, 0s); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); }
                    to { opacity: 1; transform: none; } }
.scene .pop { opacity: 0; transform-box: fill-box; transform-origin: center; }
.scene.on .pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1) forwards;
                 animation-delay: var(--d, 0s); }
@keyframes pop { from { opacity: 0; transform: scale(0); }
                 to { opacity: 1; transform: scale(1); } }
.scene .draw { stroke-dasharray: var(--len, 600); stroke-dashoffset: var(--len, 600); }
.scene.on .draw { animation: draw 1.1s ease forwards; animation-delay: var(--d, 0s); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.scene.on .pulse { animation: pulse 2.2s ease-in-out infinite;
                   animation-delay: var(--d, 0s); transform-box: fill-box;
                   transform-origin: center; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
.scene.on .shake { animation: shake .6s ease 1; animation-delay: var(--d, 1.1s);
                   transform-box: fill-box; transform-origin: center; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); }
                   40% { transform: translateX(6px); } 60% { transform: translateX(-4px); }
                   80% { transform: translateX(2px); } }
.glowY { filter: drop-shadow(0 0 7px rgba(242,201,76,.6)); }
.glowB { filter: drop-shadow(0 0 7px rgba(100,177,242,.55)); }
.glowG { filter: drop-shadow(0 0 7px rgba(95,211,162,.55)); }
.glowR { filter: drop-shadow(0 0 7px rgba(238,109,92,.55)); }
text { font-family: var(--serif); fill: var(--ink); }
.mth { font-style: italic; }
.mono { font-family: var(--mono); font-style: normal; }
.mut { fill: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01s !important; transition-duration: .01s !important; }
}
body.noanim * { animation-duration: 0s !important; animation-delay: 0s !important;
                transition-duration: 0s !important; }
@media (max-width: 640px) { h1 { font-size: 22px; } .caption { font-size: 13.5px; padding: 12px 10px 4px; } .dots { gap: 5px; } .controls { gap: 10px; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="kicker">ALIOTH · 三分钟看懂</div>
  <h1>从方程到矩阵</h1>
  <div class="sub">一台求解器的入口，以及它的边界</div>
</header>

<div class="stage-box">
<svg id="stage" viewBox="0 0 960 540" aria-label="方程离散为矩阵并求解的动画演示">

<!-- ============ S1 方程亮相 ============ -->
<g class="scene" id="sc1">
  <text class="in mth" x="480" y="235" text-anchor="middle" font-size="58">
    −∇·(<tspan fill="#F2C94C">κ</tspan>∇<tspan fill="#64B1F2">u</tspan>) = <tspan fill="#5FD3A2">f</tspan>
  </text>
  <g class="in" style="--d:.7s">
    <circle cx="330" cy="330" r="6" fill="#64B1F2"/>
    <text x="346" y="336" font-size="17"><tspan class="mth" fill="#64B1F2">u</tspan><tspan class="mut">　温度场（未知）</tspan></text>
  </g>
  <g class="in" style="--d:1.0s">
    <circle cx="330" cy="376" r="6" fill="#F2C94C"/>
    <text x="346" y="382" font-size="17"><tspan class="mth" fill="#F2C94C">κ</tspan><tspan class="mut">　材料的导热系数</tspan></text>
  </g>
  <g class="in" style="--d:1.3s">
    <circle cx="330" cy="422" r="6" fill="#5FD3A2"/>
    <text x="346" y="428" font-size="17"><tspan class="mth" fill="#5FD3A2">f</tspan><tspan class="mut">　热源</tspan></text>
  </g>
  <text class="in mut" style="--d:1.7s" x="480" y="120" text-anchor="middle" font-size="16" letter-spacing="6">变系数热传导方程</text>
</g>

<!-- ============ S2 切网格 ============ -->
<g class="scene" id="sc2">
  <text class="mth mut" x="180" y="80" text-anchor="middle" font-size="22" opacity=".8">−∇·(κ∇u) = f</text>
  <g id="grid2"></g>
  <g class="in" style="--d:1.5s">
    <text x="660" y="230" font-size="24">5 × 5 = <tspan fill="#64B1F2" font-size="30">25</tspan> 个未知数</text>
    <text x="660" y="278" font-size="17" class="mut">连续的 <tspan class="mth" fill="#64B1F2">u</tspan>(x, y)</text>
    <text x="660" y="316" font-size="17" class="mut">↓　只看格点</text>
    <text x="660" y="354" font-size="17" class="mut"><tspan class="mth" fill="#64B1F2">u</tspan><tspan font-size="12" dy="4">1</tspan><tspan dy="-4">, </tspan><tspan class="mth" fill="#64B1F2">u</tspan><tspan font-size="12" dy="4">2</tspan><tspan dy="-4">, … , </tspan><tspan class="mth" fill="#64B1F2">u</tspan><tspan font-size="12" dy="4">25</tspan></text>
    <text x="660" y="410" font-size="15" class="mut">真实仿真里，是一百万个。</text>
  </g>
</g>

<!-- ============ S3 五点模板 ============ -->
<g class="scene" id="sc3">
  <g id="grid3"></g>
  <g class="in" style="--d:1.0s">
    <text x="640" y="220" font-size="30" class="mth">
      4<tspan fill="#F2C94C">u</tspan><tspan font-size="15" dy="6" fill="#F2C94C">0</tspan><tspan dy="-6"> − </tspan><tspan fill="#64B1F2">u</tspan><tspan font-size="15" dy="6" fill="#64B1F2">左</tspan><tspan dy="-6"> − </tspan><tspan fill="#64B1F2">u</tspan><tspan font-size="15" dy="6" fill="#64B1F2">右</tspan></text>
    <text x="676" y="266" font-size="30" class="mth">− <tspan fill="#64B1F2">u</tspan><tspan font-size="15" dy="6" fill="#64B1F2">上</tspan><tspan dy="-6"> − </tspan><tspan fill="#64B1F2">u</tspan><tspan font-size="15" dy="6" fill="#64B1F2">下</tspan><tspan dy="-6"> = h²</tspan><tspan fill="#5FD3A2">f</tspan><tspan font-size="15" dy="6" fill="#5FD3A2">0</tspan>
    </text>
  </g>
  <g class="in" style="--d:1.8s">
    <rect x="628" y="310" width="238" height="54" rx="10" fill="none" stroke="#F2C94C" stroke-opacity=".55"/>
    <text x="747" y="343" text-anchor="middle" font-size="16.5">一条关系，只连 <tspan fill="#F2C94C" font-size="21">5</tspan> 个未知数</text>
  </g>
</g>

<!-- ============ S4 装配成 A ============ -->
<g class="scene" id="sc4">
  <g id="grid4" opacity=".45"></g>
  <path class="draw" style="--len:120; --d:.5s" d="M 320 270 C 360 270 380 270 415 270"
        stroke="#93AACB" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g id="mat4"></g>
  <g class="in" style="--d:2.6s">
    <text x="752" y="250" font-size="44" class="mth">
      <tspan fill="#F2C94C" class="glowY">A</tspan><tspan fill="#64B1F2"> x</tspan> = <tspan fill="#5FD3A2">f</tspan>
    </text>
    <text x="752" y="300" font-size="15.5" class="mut">A：25 × 25，邻居关系</text>
    <text x="752" y="332" font-size="15.5" class="mut">x：25 个未知数</text>
    <text x="752" y="364" font-size="15.5" class="mut">f：热源与边界</text>
  </g>
</g>

<!-- ============ S5 稀疏之美 ============ -->
<g class="scene" id="sc5">
  <g id="mat5"></g>
  <g class="in" style="--d:1.2s">
    <text x="700" y="215" font-size="21">每行只有 <tspan fill="#F2C94C" font-size="30">≈ 5</tspan> 个非零元</text>
    <text x="700" y="268" font-size="16" class="mut">一百万未知数</text>
    <text x="700" y="300" font-size="16" class="mut">≈ 五百万非零元，而不是一万亿</text>
    <text x="700" y="352" font-size="16.5">稀疏，让百万阶矩阵</text>
    <text x="700" y="384" font-size="16.5">存得下、算得动。</text>
  </g>
</g>

<!-- ============ S6 迭代求解 ============ -->
<g class="scene" id="sc6">
  <g id="heat6"></g>
  <g class="in">
    <text x="250" y="105" text-anchor="middle" font-size="17" class="mut">解 <tspan class="mth" fill="#64B1F2">x</tspan> 回到网格上，就是温度场</text>
  </g>
  <!-- convergence plot -->
  <g transform="translate(560,110)">
    <line x1="0" y1="0" x2="0" y2="310" stroke="#2C4A78" stroke-width="1.5"/>
    <line x1="0" y1="310" x2="330" y2="310" stroke="#2C4A78" stroke-width="1.5"/>
    <text x="-14" y="18" text-anchor="end" font-size="13" class="mono mut">1e0</text>
    <text x="-14" y="168" text-anchor="end" font-size="13" class="mono mut">1e-4</text>
    <text x="-14" y="296" text-anchor="end" font-size="13" class="mono mut">1e-8</text>
    <line x1="0" y1="290" x2="330" y2="290" stroke="#5FD3A2" stroke-width="1.2"
          stroke-dasharray="6 6" opacity=".65"/>
    <text x="336" y="295" font-size="13" fill="#5FD3A2">目标</text>
    <polyline class="draw" style="--len:520; --d:.6s"
      points="8,14 40,52 72,74 104,108 136,128 168,158 200,180 232,214 264,238 288,262 306,290"
      fill="none" stroke="#64B1F2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="pop glowG" style="--d:1.9s" cx="306" cy="290" r="7" fill="#5FD3A2"/>
    <text class="in" style="--d:2.1s" x="165" y="345" text-anchor="middle" font-size="15" class="mut"><tspan class="mut">28 次迭代，残差 &lt; 1e-8</tspan></text>
    <text x="165" y="-24" text-anchor="middle" font-size="16" class="mut">迭代次数 →</text>
  </g>
</g>

<!-- ============ S7 大多数都走这条路 ============ -->
<g class="scene" id="sc7">
  <g id="chips7"></g>
  <g class="in" style="--d:1.6s">
    <rect x="392" y="212" width="212" height="98" rx="14" fill="none" stroke="#F2C94C"
          stroke-width="2" class="glowY"/>
    <text x="498" y="254" text-anchor="middle" font-size="19">对称正定 · 稀疏</text>
    <text x="498" y="286" text-anchor="middle" font-size="16" class="mut">同一类矩阵</text>
  </g>
  <path class="draw" style="--len:100; --d:2.2s" d="M 612 261 C 650 261 660 261 690 261"
        stroke="#93AACB" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g class="in" style="--d:2.6s">
    <rect x="700" y="212" width="180" height="98" rx="14" fill="#132E52"/>
    <text x="790" y="248" text-anchor="middle" font-size="16.5">多重网格 · 共轭梯度</text>
    <text x="790" y="282" text-anchor="middle" font-size="15" fill="#5FD3A2">✓ 解 + 回执</text>
  </g>
</g>

<!-- ============ S8 例外一(上)：什么是非线性 ============ -->
<g class="scene" id="sc8">
  <g class="in">
    <text x="110" y="126" font-size="15" class="mut">此前的热传导：线性</text>
    <text x="110" y="182" font-size="29" class="mth">−∇·( <tspan fill="#F2C94C">κ</tspan> ∇<tspan fill="#64B1F2">u</tspan> ) = <tspan fill="#5FD3A2">f</tspan></text>
    <text x="110" y="226" font-size="14.5" class="mut">系数 <tspan class="mth" fill="#F2C94C">κ</tspan> 是已知的材料参数，直接装配 <tspan fill="#5FD3A2">✓</tspan></text>
  </g>
  <g class="in" style="--d:.9s">
    <text x="110" y="308" font-size="15" class="mut">流体的对流项：非线性</text>
    <ellipse cx="136" cy="366" rx="17" ry="23" fill="none" stroke="#64B1F2" stroke-width="1.5" stroke-dasharray="4 3"/>
    <ellipse cx="224" cy="366" rx="17" ry="23" fill="none" stroke="#64B1F2" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text y="376" font-size="29" class="mth"><tspan x="108">(</tspan><tspan x="129" fill="#64B1F2">u</tspan><tspan x="154">·∇</tspan><tspan x="196">)</tspan><tspan x="217" fill="#64B1F2">u</tspan></text>
    <path d="M 136 400 Q 180 430 224 400" fill="none" stroke="#64B1F2" stroke-width="1.3"/>
    <text x="180" y="452" text-anchor="middle" font-size="13" fill="#64B1F2">同一个未知数，出现两次</text>
    <text x="110" y="492" font-size="14.5" class="mut">“系数”是 <tspan class="mth" fill="#64B1F2">u</tspan> 本身：要装配，得先知道答案 <tspan fill="#EE6D5C">✗</tspan></text>
  </g>
  <g class="in" style="--d:1.9s">
    <rect x="560" y="182" width="308" height="58" rx="12" fill="#132E52"/>
    <text x="714" y="217" text-anchor="middle" font-size="15.5">装配 <tspan class="mth" fill="#F2C94C">A</tspan>，需要先知道系数 <tspan class="mth" fill="#64B1F2">u</tspan></text>
    <rect x="560" y="322" width="308" height="58" rx="12" fill="#132E52"/>
    <text x="714" y="357" text-anchor="middle" font-size="15.5">解出 <tspan class="mth" fill="#64B1F2">u</tspan>，需要先有矩阵 <tspan class="mth" fill="#F2C94C">A</tspan></text>
    <path d="M 838 246 Q 872 281 838 316" fill="none" stroke="#EE6D5C" stroke-width="1.8" marker-end="url(#arrowR)"/>
    <path d="M 590 316 Q 556 281 590 246" fill="none" stroke="#EE6D5C" stroke-width="1.8" marker-end="url(#arrowR)"/>
    <text x="714" y="288" text-anchor="middle" font-size="15" fill="#EE6D5C">循环依赖：鸡生蛋，蛋生鸡</text>
  </g>
</g>

<!-- ============ S9 例外一(下)：牛顿迭代怎么转 ============ -->
<g class="scene" id="sc9">
  <g class="in">
    <rect x="368" y="88" width="224" height="56" rx="11" fill="#132E52"/>
    <text x="480" y="114" text-anchor="middle" font-size="15">① 先猜一个解 <tspan class="mth" fill="#64B1F2">x</tspan><tspan font-size="11" dy="4">0</tspan></text>
    <text x="480" y="134" text-anchor="middle" font-size="12" class="mut">瞎猜也行，比如全零</text>
  </g>
  <g class="in" style="--d:.6s">
    <rect x="688" y="238" width="240" height="60" rx="11" fill="#132E52"/>
    <text x="808" y="264" text-anchor="middle" font-size="15">② 冻结：用猜测算出系数</text>
    <text x="808" y="286" text-anchor="middle" font-size="12.5" class="mut"><tspan class="mth" fill="#64B1F2">u</tspan> 暂时当已知，装配出 <tspan class="mth" fill="#F2C94C">A</tspan><tspan font-size="10" dy="3">k</tspan></text>
  </g>
  <g class="in" style="--d:1.2s">
    <rect x="356" y="424" width="248" height="60" rx="11" fill="none" stroke="#F2C94C" stroke-width="1.8" class="glowY"/>
    <text x="480" y="450" text-anchor="middle" font-size="17" class="mth"><tspan fill="#F2C94C">A</tspan><tspan font-size="11" dy="4">k</tspan><tspan dy="-4" fill="#64B1F2"> x</tspan> = <tspan fill="#5FD3A2">f</tspan></text>
    <text x="480" y="472" text-anchor="middle" font-size="12.5" class="mut">③ 解线性方程：前面的老手艺全用得上</text>
  </g>
  <g class="in" style="--d:1.8s">
    <rect x="32" y="238" width="240" height="60" rx="11" fill="#132E52"/>
    <text x="152" y="264" text-anchor="middle" font-size="15">④ 得到更好的猜测</text>
    <text x="152" y="286" text-anchor="middle" font-size="12.5" class="mut">解冻，回到 ②，再转一圈</text>
  </g>
  <path class="draw" style="--len:260; --d:2.3s" d="M 604 120 Q 780 150 802 230" fill="none" stroke="#B48CF2" stroke-width="1.8" marker-end="url(#arrowP)"/>
  <path class="draw" style="--len:260; --d:2.6s" d="M 802 306 Q 776 420 612 450" fill="none" stroke="#B48CF2" stroke-width="1.8" marker-end="url(#arrowP)"/>
  <path class="draw" style="--len:260; --d:2.9s" d="M 348 452 Q 184 420 158 306" fill="none" stroke="#B48CF2" stroke-width="1.8" marker-end="url(#arrowP)"/>
  <path class="draw" style="--len:260; --d:3.2s" d="M 158 230 Q 182 150 356 122" fill="none" stroke="#B48CF2" stroke-width="1.8" marker-end="url(#arrowP)"/>
  <g class="in" style="--d:3.6s">
    <text x="480" y="266" text-anchor="middle" font-size="14" class="mut">残差一圈圈缩小</text>
    <text x="480" y="300" text-anchor="middle" font-size="16" class="mono"><tspan fill="#EE6D5C">1e0</tspan> → <tspan fill="#F2C94C">1e-2</tspan> → <tspan fill="#64B1F2">1e-5</tspan> → <tspan fill="#5FD3A2">1e-8</tspan></text>
    <text x="480" y="334" text-anchor="middle" font-size="13" class="mut">每圈解一张线性矩阵，几圈到几十圈收敛</text>
  </g>
</g>

<!-- ============ S10 什么是对称正定 ============ -->
<g class="scene" id="sc10">
  <text class="in" x="238" y="96" text-anchor="middle" font-size="17">对称：作用是相互的</text>
  <g id="sym10"></g>
  <g class="in" style="--d:1.3s">
    <text x="238" y="398" text-anchor="middle" font-size="16" class="mth">a<tspan font-size="11" dy="4">ij</tspan><tspan dy="-4"> = a</tspan><tspan font-size="11" dy="4">ji</tspan></text>
    <text x="238" y="428" text-anchor="middle" font-size="13.5" class="mut">两点之间一条导热路径，两头共用</text>
  </g>
  <text class="in" style="--d:.5s" x="712" y="96" text-anchor="middle" font-size="17">正定：能量地形是一只碗</text>
  <g class="in" style="--d:.8s">
    <path d="M 560 186 Q 712 424 864 186" fill="none" stroke="#64B1F2" stroke-width="2.4"/>
    <circle cx="712" cy="305" r="10" fill="#5FD3A2" class="glowG"/>
    <path d="M 600 232 q 28 36 56 54" fill="none" stroke="#93AACB" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="586" y="216" font-size="12.5" class="mut">往低处滚</text>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  /* ---- grids for S2/S3/S4 (5x5 nodes, spacing 62, origin 130,140) ---- */
  function buildGrid(id, opts) {
    var g = document.getElementById(id);
    var ox = opts.ox, oy = opts.oy, s = opts.s, n = 5;
    var i, j;
    for (i = 0; i < n; i++) {
      var lenH = s * (n - 1);
      var ln = el("line", { x1: ox, y1: oy + i * s, x2: ox + lenH, y2: oy + i * s,
        stroke: "#2C4A78", "stroke-width": 1.4, "class": "draw" }, g);
      ln.style.setProperty("--len", lenH);
      ln.style.setProperty("--d", (i * 0.08) + "s");
      var lv = el("line", { x1: ox + i * s, y1: oy, x2: ox + i * s, y2: oy + s * (n - 1),
        stroke: "#2C4A78", "stroke-width": 1.4, "class": "draw" }, g);
      lv.style.setProperty("--len", s * (n - 1));
      lv.style.setProperty("--d", (0.3 + i * 0.08) + "s");
    }
    for (i = 0; i < n; i++) for (j = 0; j < n; j++) {
      var cx = ox + j * s, cy = oy + i * s;
      var isC = opts.stencil && i === 2 && j === 2;
      var isN = opts.stencil && ((Math.abs(i - 2) + Math.abs(j - 2)) === 1);
      if (opts.stencil && isC) {
        el("line", { x1: cx - s, y1: cy, x2: cx + s, y2: cy, stroke: "#64B1F2",
          "stroke-width": 3, "class": "in glowB" }, g).style.setProperty("--d", "0.8s");
        el("line", { x1: cx, y1: cy - s, x2: cx, y2: cy + s, stroke: "#64B1F2",
          "stroke-width": 3, "class": "in glowB" }, g).style.setProperty("--d", "0.8s");
      }
      var c = el("circle", { cx: cx, cy: cy,
        r: isC ? 11 : (isN ? 8.5 : 5.5),
        fill: isC ? "#F2C94C" : (isN ? "#64B1F2" : "#4E6589"),
        "class": "pop" + (isC ? " glowY" : (isN ? " glowB" : "")) }, g);
      c.style.setProperty("--d", (0.7 + (i * n + j) * 0.028) + "s");
      if (opts.dimOthers && !isC && !isN) c.setAttribute("opacity", "0.4");
    }
    if (opts.stencil) {
      var lbl = el("text", { x: ox + 2 * s - 18, y: oy + 2 * s - 18, "text-anchor": "end",
        "font-size": 15, fill: "#F2C94C", "class": "in" }, g);
      lbl.style.setProperty("--d", "1.2s");
      lbl.textContent = "u₀";
    }
  }
  buildGrid("grid2", { ox: 150, oy: 150, s: 62 });
  buildGrid("grid3", { ox: 150, oy: 150, s: 62, stencil: true, dimOthers: true });
  buildGrid("grid4", { ox: 80, oy: 160, s: 55 });

  /* ---- 25x25 banded matrix for S4/S5 ---- */
  function buildMatrix(id, opts) {
    var g = document.getElementById(id);
    var n = 25, cell = opts.cell, gap = 1.6, ox = opts.ox, oy = opts.oy;
    var W = n * (cell + gap);
    el("path", { d: "M " + (ox - 10) + " " + (oy - 6) + " h -9 v " + (W + 12) + " h 9",
      stroke: "#93AACB", "stroke-width": 2.4, fill: "none" }, g);
    el("path", { d: "M " + (ox + W + 8) + " " + (oy - 6) + " h 9 v " + (W + 12) + " h -9",
      stroke: "#93AACB", "stroke-width": 2.4, fill: "none" }, g);
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        var on = false, main = false;
        if (r === c) { on = true; main = true; }
        else if (Math.abs(r - c) === 5) on = true;
        else if (Math.abs(r - c) === 1 && Math.floor(r / 5) === Math.floor(c / 5)) on = true;
        if (!on) continue;
        var hlRow = opts.hlRow != null && r === opts.hlRow;
        var d = el("rect", {
          x: ox + c * (cell + gap), y: oy + r * (cell + gap),
          width: cell, height: cell, rx: 1.6,
          fill: hlRow ? "#EAF2FC" : (main ? "#F2C94C" : "#8A7A34"),
          "class": "pop" + (hlRow ? " pulse" : "")
        }, g);
        d.style.setProperty("--d", (0.25 + r * 0.055) + "s");
      }
    }
    if (opts.hlRow != null) {
      var y = oy + opts.hlRow * (cell + gap) + cell / 2;
      var br = el("path", { d: "M " + (ox + W + 30) + " " + (y - 9) + " q 10 9 0 18",
        stroke: "#EAF2FC", "stroke-width": 1.6, fill: "none", "class": "in" }, g);
      br.style.setProperty("--d", "1s");
      var t = el("text", { x: ox + W + 48, y: y + 5, "font-size": 14.5,
        fill: "#EAF2FC", "class": "in" }, g);
      t.style.setProperty("--d", "1.05s");
      t.textContent = "第 13 行：5 个非零元";
    }
  }
  buildMatrix("mat4", { ox: 450, oy: 140, cell: 8.4 });
  buildMatrix("mat5", { ox: 170, oy: 130, cell: 11, hlRow: 12 });

  /* ---- S6 heatmap: two hot spots on 10x10 patch ---- */
  (function () {
    var g = document.getElementById("heat6");
    var n = 10, cell = 30, ox = 100, oy = 130;
    function field(x, y) {
      var v = 0;
      v += Math.exp(-((x - 0.3) * (x - 0.3) + (y - 0.35) * (y - 0.35)) / 0.045);
      v += 0.75 * Math.exp(-((x - 0.72) * (x - 0.72) + (y - 0.7) * (y - 0.7)) / 0.03);
      return Math.min(1, v);
    }
    function color(v) {
      var stops = [[15, 38, 71], [36, 86, 196], [100, 177, 242], [242, 201, 76], [238, 109, 92]];
      var t = v * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(t)), fr = t - i;
      var a = stops[i], b = stops[i + 1];
      return "rgb(" + Math.round(a[0] + (b[0] - a[0]) * fr) + "," +
        Math.round(a[1] + (b[1] - a[1]) * fr) + "," + Math.round(a[2] + (b[2] - a[2]) * fr) + ")";
    }
    for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) {
      var v = field((j + 0.5) / n, (i + 0.5) / n);
      var r = el("rect", { x: ox + j * cell, y: oy + i * cell, width: cell - 1.5,
        height: cell - 1.5, rx: 2.5, fill: color(v), "class": "in" }, g);
      r.style.setProperty("--d", (0.2 + (i + j) * 0.05) + "s");
    }
  })();

  /* ---- S7 chips ---- */
  (function () {
    var g = document.getElementById("chips7");
    var names = ["热传导", "结构力学", "电路网络", "地下水", "生态扩散", "静电场"];
    for (var i = 0; i < names.length; i++) {
      var y = 88 + i * 62;
      var grp = el("g", { "class": "in" }, g);
      grp.style.setProperty("--d", (i * 0.16) + "s");
      el("rect", { x: 96, y: y, width: 138, height: 44, rx: 22,
        fill: "#132E52" }, grp);
      var t = el("text", { x: 165, y: y + 28, "text-anchor": "middle",
        "font-size": 15.5 }, grp);
      t.textContent = names[i];
      var p = el("path", { d: "M 240 " + (y + 22) + " C 320 " + (y + 22) + " 330 261 384 261",
        stroke: "#2C4A78", "stroke-width": 1.6, fill: "none", "class": "draw" }, grp);
      p.style.setProperty("--len", 260);
      p.style.setProperty("--d", (0.5 + i * 0.16) + "s");
    }
  })();

  /* ---- S10 spectra ---- */
  function buildSpec(id, continuous, dx) {
    var g = document.getElementById(id);
    var ox = dx, oy = 280, W = 330;
    el("line", { x1: ox, y1: oy, x2: ox + W, y2: oy, stroke: "#2C4A78", "stroke-width": 1.5 }, g);
    var t1 = el("text", { x: ox, y: oy + 24, "font-size": 12.5, fill: "#93AACB" }, g);
    t1.textContent = "低能 ←";
    var t2 = el("text", { x: ox + W, y: oy + 24, "font-size": 12.5, fill: "#93AACB",
      "text-anchor": "end" }, g);
    t2.textContent = "→ 高能";
    var bars = continuous
      ? [0.02,0.045,0.07,0.095,0.12,0.145,0.17,0.20,0.23,0.26,0.30,0.34,0.39,0.45,0.52,0.60,0.70,0.82,0.95]
      : [0.03, 0.09, 0.17, 0.55, 0.62, 0.68, 0.75, 0.81, 0.87, 0.93];
    for (var i = 0; i < bars.length; i++) {
      var x = ox + bars[i] * W;
      var low = continuous ? (bars[i] < 0.42) : (bars[i] < 0.3);
      var h = 26 + 30 * (1 - bars[i]);
      var b = el("line", { x1: x, y1: oy - 4, x2: x, y2: oy - 4 - h,
        stroke: low ? (continuous ? "#EE6D5C" : "#5FD3A2") : "#4E6589",
        "stroke-width": continuous ? 4.5 : 5.5, "stroke-linecap": "round",
        "class": "in" }, g);
      b.style.setProperty("--d", (0.3 + i * 0.05) + "s");
    }
    if (!continuous) {
      for (var k = 0; k < 3; k++) {
        var xx = ox + bars[k] * W;
        var c = el("circle", { cx: xx, cy: oy - 40, r: 13, fill: "none",
          stroke: "#5FD3A2", "stroke-width": 1.5, "stroke-dasharray": "4 3",
          "class": "pop" }, g);
        c.style.setProperty("--d", (0.9 + k * 0.15) + "s");
      }
    } else {
      var net = el("path", {
        d: "M " + (ox + 8) + " 218 q 60 -26 130 -8", fill: "none",
        stroke: "#EE6D5C", "stroke-width": 1.5, "stroke-dasharray": "4 3",
        "class": "in" }, g);
      net.style.setProperty("--d", "1.1s");
    }
  }
  buildSpec("spec10a", false, 90);
  buildSpec("spec10b", true, 540);


  /* ---- S10 symmetric mini-matrix ---- */
  (function () {
    var g = document.getElementById("sym10");
    var n = 8, cell = 24, gap = 2, ox = 134, oy = 128;
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      var hl = (r === 2 && c === 6) || (r === 6 && c === 2);
      var d = el("rect", { x: ox + c * (cell + gap), y: oy + r * (cell + gap),
        width: cell, height: cell, rx: 3,
        fill: hl ? "#64B1F2" : (r === c ? "#8A7A34" : "#1B3A63"),
        "class": "pop" }, g);
      if (hl) {
        var ring = el("rect", { x: ox + c * (cell + gap) - 4, y: oy + r * (cell + gap) - 4,
          width: cell + 8, height: cell + 8, rx: 6, fill: "none",
          stroke: "#64B1F2", "stroke-width": 1.5, "class": "pulse" }, g);
        ring.style.setProperty("--d", "1.2s");
      }
      d.style.setProperty("--d", (0.15 + (r + c) * 0.035) + "s");
    }
    var W = n * (cell + gap) - gap;
    var diag = el("line", { x1: ox, y1: oy, x2: ox + W, y2: oy + W,
      stroke: "#93AACB", "stroke-width": 1, "stroke-dasharray": "4 4",
      "class": "in", opacity: .7 }, g);
    diag.style.setProperty("--d", "0.9s");
    var link = el("line", {
      x1: ox + 6 * (cell + gap) + cell / 2, y1: oy + 2 * (cell + gap) + cell / 2,
      x2: ox + 2 * (cell + gap) + cell / 2, y2: oy + 6 * (cell + gap) + cell / 2,
      stroke: "#64B1F2", "stroke-width": 1.3, "stroke-dasharray": "5 4",
      "class": "in" }, g);
    link.style.setProperty("--d", "1.1s");
  })();

  /* ---- S11 one-way wind ---- */
  (function () {
    var g = document.getElementById("wind11");
    var xs = [566, 664, 762, 860], y = 210;
    for (var i = 0; i < xs.length; i++) {
      var c = el("circle", { cx: xs[i], cy: y, r: 9, fill: "#4E6589", "class": "pop" }, g);
      c.style.setProperty("--d", (1.6 + i * 0.12) + "s");
      if (i < xs.length - 1) {
        var a = el("line", { x1: xs[i] + 15, y1: y, x2: xs[i + 1] - 17, y2: y,
          stroke: "#64B1F2", "stroke-width": 2, "marker-end": "url(#arrow)",
          "class": "in" }, g);
        a.style.setProperty("--d", (1.75 + i * 0.12) + "s");
      }
    }
    var back = el("path", { d: "M 745 238 Q 713 268 681 238", fill: "none",
      stroke: "#EE6D5C", "stroke-width": 1.6, "stroke-dasharray": "5 4",
      "marker-end": "url(#arrowR)", "class": "in" }, g);
    back.style.setProperty("--d", "2.1s");
    var x = el("text", { x: 713, y: 262, "text-anchor": "middle", "font-size": 14,
      fill: "#EE6D5C", "class": "in" }, g);
    x.style.setProperty("--d", "2.2s");
    x.textContent = "✗";
  })();


  /* ---- S13 solver anatomy ---- */
  buildMatrix("mat13", { ox: 64, oy: 150, cell: 5.0 });
  (function () {
    var g = document.getElementById("net13");
    var cols = [[322, 4], [368, 5], [414, 3]];
    var pts = [];
    for (var c = 0; c < cols.length; c++) {
      var x = cols[c][0], n = cols[c][1], col = [];
      for (var i = 0; i < n; i++) col.push([x, 232 + (i - (n - 1) / 2) * 28]);
      pts.push(col);
    }
    for (var c = 0; c < pts.length - 1; c++)
      for (var i = 0; i < pts[c].length; i++)
        for (var j = 0; j < pts[c + 1].length; j++) {
          var ln = el("line", { x1: pts[c][i][0], y1: pts[c][i][1],
            x2: pts[c + 1][j][0], y2: pts[c + 1][j][1],
            stroke: "#2C4A78", "stroke-width": 1, "class": "in" }, g);
          ln.style.setProperty("--d", (1.3 + c * 0.15) + "s");
        }
    for (var c = 0; c < pts.length; c++)
      for (var i = 0; i < pts[c].length; i++) {
        var d = el("circle", { cx: pts[c][i][0], cy: pts[c][i][1], r: 6,
          fill: "#F2C94C", "class": "pop glowY" }, g);
        d.style.setProperty("--d", (1.35 + c * 0.15 + i * 0.05) + "s");
      }
  })();
  (function () {
    var g = document.getElementById("wgrid13");
    var n = 6, s = 17, ox = 552, oy = 146;
    for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) {
      var w = 0.30 + 0.55 * Math.abs(Math.sin(i * 1.7 + j * 2.3));
      var col = "rgb(" + Math.round(30 + 90 * w) + "," + Math.round(60 + 130 * w) + "," +
        Math.round(110 + 145 * w) + ")";
      var d = el("circle", { cx: ox + j * s, cy: oy + i * s, r: 3 + 3.6 * w,
        fill: col, "class": "pop" }, g);
      d.style.setProperty("--d", (2.6 + (i + j) * 0.04) + "s");
    }
  })();
  (function () {
    var g = document.getElementById("interp13");
    var fx = [], i;
    for (i = 0; i < 7; i++) fx.push(546 + i * 19);
    var cx = [565, 603, 641];
    var fanTo = [[0, 1, 2], [2, 3, 4], [4, 5, 6]];
    for (i = 0; i < cx.length; i++)
      for (var k = 0; k < 3; k++) {
        var ln = el("line", { x1: cx[i], y1: 394, x2: fx[fanTo[i][k]], y2: 340,
          stroke: "#B48CF2", "stroke-width": 1.2, opacity: .75, "class": "in" }, g);
        ln.style.setProperty("--d", (3.0 + i * 0.12) + "s");
      }
    for (i = 0; i < fx.length; i++) {
      var d = el("circle", { cx: fx[i], cy: 336, r: 4.5, fill: "#64B1F2", "class": "pop" }, g);
      d.style.setProperty("--d", (2.8 + i * 0.04) + "s");
    }
    for (i = 0; i < cx.length; i++) {
      var d2 = el("circle", { cx: cx[i], cy: 398, r: 6.5, fill: "#B48CF2", "class": "pop" }, g);
      d2.style.setProperty("--d", (3.2 + i * 0.08) + "s");
    }
    var t1 = el("text", { x: 690, y: 341, "font-size": 12, fill: "#93AACB", "class": "in" }, g);
    t1.style.setProperty("--d", "3.3s"); t1.textContent = "细网格";
    var t2 = el("text", { x: 690, y: 403, "font-size": 12, fill: "#93AACB", "class": "in" }, g);
    t2.style.setProperty("--d", "3.4s"); t2.textContent = "粗网格";
  })();

  /* ---- S14 dictionary ---- */
  (function () {
    var g = document.getElementById("dict14");
    var rows = [
      ["迭代求解：把残差压到 1e-8", "训练：把 loss 压下去"],
      ["松弛因子（专家手调）", "learning rate（手调）"],
      ["逐点平滑权重", "Adam：每个参数一个学习率"],
      ["多重网格 · 层间插值", "U-Net：下采样 / 上采样"],
      ["玉衡：读矩阵，生成求解器", "Hypernetwork：读任务，生成优化器"],
    ];
    for (var i = 0; i < rows.length; i++) {
      var y = 118 + i * 74;
      var grp = el("g", { "class": "in" }, g);
      grp.style.setProperty("--d", (0.3 + i * 0.5) + "s");
      el("rect", { x: 84, y: y, width: 356, height: 50, rx: 25,
        fill: "#132E52", stroke: "#64B1F2", "stroke-opacity": .4,
        "stroke-width": 1.3 }, grp);
      var tL = el("text", { x: 262, y: y + 31, "text-anchor": "middle",
        "font-size": 15 }, grp);
      tL.textContent = rows[i][0];
      var eq = el("text", { x: 480, y: y + 33, "text-anchor": "middle",
        "font-size": 22, fill: "#5FD3A2" }, grp);
      eq.textContent = "≈";
      el("rect", { x: 520, y: y, width: 360, height: 50, rx: 25,
        fill: "#132E52", stroke: "#F2C94C", "stroke-opacity": .4,
        "stroke-width": 1.3 }, grp);
      var tR = el("text", { x: 700, y: y + 31, "text-anchor": "middle",
        "font-size": 15 }, grp);
      tR.textContent = rows[i][1];
    }
  })();

  /* ---------------- scene player ---------------- */
  var caps = [
    '从一个物理方程开始：变系数热传导。<span class="b">u</span> 是要求的温度场，<span class="g">f</span> 是热源。眼下它还是连续的，计算机没法直接吃下去。',
    '第一步，<em>离散</em>：把区域切成网格，只在格点上记录 <span class="b">u</span> 的值。连续的场，变成 25 个数。真实仿真里，是一百万个。',
    '在每个格点上，导数变成与邻居的差分：一条线性关系，只连五个未知数。<em>物理是局部的</em>，这将是稀疏的来源。',
    '25 个格点，25 条关系，叠成 25 行：方程变成了矩阵。<em>A</em> 记录邻居关系，<span class="b">x</span> 收纳全部未知数，<span class="g">f</span> 是热源与边界。从此，解方程就是解 <em>A</em><span class="b">x</span> = <span class="g">f</span>。',
    '这张矩阵巨大，却几乎全是零。百万阶的 <em>A</em>，只有几百万个非零元。<em>稀疏</em>，让它存得下、算得动。',
    '第二步，<em>求解</em>：迭代把残差一路压到 1e-8。<span class="b">x</span> 回到网格上，就是温度场。方程，解完了。',
    '热、结构、电路、扩散……工业仿真的大部分方程，离散后都汇成同一类矩阵：<em>对称正定、稀疏</em>。这是多重网格与共轭梯度的主场。',
    '但也有例外。热传导里系数 <em>κ</em> 是已知的材料参数；流体的对流项 (<span class="b">u</span>·∇)<span class="b">u</span> 里，<span class="b">u</span> 出现了两次：速度场被它自己输运。装配矩阵要先知道系数，而这里的“系数”正是要求的答案。<span class="r">循环依赖，没法一步装配</span>：这就是非线性。',
    '破法是<em>冻结</em>：先猜一个解，把“系数”按在猜测值上不动，方程瞬间变成线性的；解出更好的猜测，解冻，再冻结、再解。<span class="p">每转一圈解一张线性矩阵</span>，几圈到几十圈后收敛：非线性问题，是一串线性问题。',
    '<em>对称</em>：两点间的作用是相互的，i 影响 j 多少，j 就反过来影响 i 多少，矩阵沿对角线镜像。<em>正定</em>：任何状态的能量都为正，能量地形是一只碗，唯一的碗底就是解。热、结构、电路是耗散系统，离散后天然如此：<span class="g">求解，就是滚向碗底</span>。',
    '波动方程的 <span class="r">−k²u</span> 项从刚度里往外减：频率一高，部分方向翻负，<span class="r">碗塌成马鞍</span>，“往低处滚”失去方向，共轭梯度失灵。强对流则是<span class="r">单行道</span>：上游影响下游，反过来不行，镜像被打破。这两片属于 <span class="p">GMRES 与专门设计的预条件器</span>。',
    '还有少数矩阵（比如基准里的 cfd2），<span class="r">低能谱连成一片</span>，粗网格网不住。此时体面的做法是回退：经典迭代慢而必达，回执写明原委。<em>求解器可以失败，服务不能失败。</em>',
    '回到主线。玉衡读一眼矩阵，一次前向，<em>同时</em>吐出两样组件：<span class="b">逐点平滑权重</span>，一张跟着矩阵走的数值场；<span class="p">层间插值算子</span>，粗点由细邻居加权而来。两样一起交给<span class="g">共轭梯度</span>收尾。过去靠专家逐题调校的旋钮，现在是<em>数十毫秒的一次生成</em>。觉得像天书？下一幕，用 AI 的话再说一遍。',
    '给 AI 同行翻一下。迭代求解就是训练，<em>残差是 loss</em>；松弛因子是 learning rate。玉衡的逐点权重，是<span class="b">给每个参数配学习率：一个现场生成的 Adam</span>；多重网格上下采样、由粗到细，长得像 U-Net。玉衡本身，就是个 <span class="p">hypernetwork</span>。',
    '从方程到矩阵，从矩阵到解：这条流水线吃下工业仿真的绝大部分；吃不下的，各有手法兜底。玉衡做的，是让中间那台<em>求解器</em>，由 AI 为每一张矩阵现场生成。',
  ];
  var N = caps.length, cur = -1, playing = true, timer = null;
  var DUR = [6000, 7000, 7000, 8000, 6500, 7500, 8000, 11000, 11000, 12000, 12000, 9000, 12000, 12000, 10000];
  var scenes = [];
  for (var i = 1; i <= N; i++) scenes.push(document.getElementById("sc" + i));
  var capEl = document.getElementById("caption");
  var dotsEl = document.getElementById("dots");
  var idxEl = document.getElementById("idx");
  var playBtn = document.getElementById("play");
  for (var d = 0; d < N; d++) {
    var dot = document.createElement("i");
    (function (k) { dot.addEventListener("click", function () { go(k); hold(); }); })(d);
    dotsEl.appendChild(dot);
  }
  function go(k) {
    if (k < 0) k = 0;
    if (k >= N) k = N - 1;
    if (k === cur) return;
    if (cur >= 0) scenes[cur].classList.remove("on");
    cur = k;
    var sc = scenes[cur];
    void sc.getBBox;
    sc.classList.add("on");
    capEl.style.opacity = 0;
    setTimeout(function () { capEl.innerHTML = caps[k]; capEl.style.opacity = 1; }, 220);
    var ds = dotsEl.children;
    for (var i = 0; i < N; i++) ds[i].className = i === k ? "on" : "";
    idxEl.textContent = (k + 1) + " / " + N;
    schedule();
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    if (!playing) return;
    if (cur >= N - 1) { setPlaying(false); return; }
    timer = setTimeout(function () { go(cur + 1); }, DUR[cur]);
  }
  function setPlaying(p) {
    playing = p;
    playBtn.textContent = p ? "⏸" : "▶";
    if (p) schedule(); else if (timer) clearTimeout(timer);
  }
  function hold() { setPlaying(false); }
  document.getElementById("prev").addEventListener("click", function () { go(cur - 1); hold(); });
  document.getElementById("next").addEventListener("click", function () { go(cur + 1); hold(); });
  playBtn.addEventListener("click", function () {
    if (!playing && cur >= N - 1) { go(0); setPlaying(true); return; }
    setPlaying(!playing);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { go(cur + 1); hold(); }
    if (e.key === "ArrowLeft") { go(cur - 1); hold(); }
    if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  });
  var q = new URLSearchParams(location.search);
  if (q.get("noanim") === "1") document.body.classList.add("noanim");
  var s0 = parseInt(q.get("scene") || "1", 10) - 1;
  if (s0 > 0) setPlaying(false);
  go(isNaN(s0) ? 0 : s0);
})();
</script>
</body>
</html>
